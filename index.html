<!-- Avant tout rendu, sinon un lecteur en thème sombre voit un flash blanc. -->
<!-- 'obs-theme' duplique THEME_CLE de js/theme.js : un module ES ne peut pas
     s'exécuter de façon synchrone et bloquante ici, avant le premier rendu.
     Si THEME_CLE change, changer cette chaîne aussi. -->
<script>
  try {
    var t = localStorage.getItem('obs-theme')
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
  } catch (e) {}
</script>
